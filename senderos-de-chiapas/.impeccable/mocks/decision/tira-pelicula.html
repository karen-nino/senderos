<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fdf9f1;font-family:Prompt,sans-serif;color:#1c231f}
header{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.logo{font-weight:800;font-size:26px;color:#d7262e;line-height:.9}
nav{display:flex;gap:30px;font-weight:500;font-size:17px;color:#63ab45}
.hdr-btn{background:#63ab45;color:#fff;border-radius:999px;padding:16px 28px;font-weight:600}
.film{position:relative;margin-top:14px;height:500px;background:#1c231f;padding:44px 0;transform:rotate(-1.5deg);width:1520px;margin-left:-40px}
.holes{position:absolute;left:0;right:0;height:22px;background:repeating-linear-gradient(90deg,transparent 0 14px,#fdf9f1 14px 34px,transparent 34px 48px);background-clip:content-box;padding:0}
.holes{-webkit-mask:linear-gradient(#000 0 0);border-radius:0}
.h1{top:11px}.h2{bottom:11px}
.holes::before{content:"";position:absolute;inset:0;background:inherit;border-radius:5px}
.frames{display:flex;gap:18px;height:100%;align-items:stretch;justify-content:center}
.f{flex:0 0 360px;background:#555 center/cover;border-radius:4px;opacity:.55;position:relative}
.f.on{flex-basis:700px;opacity:1}
.f .n{position:absolute;left:10px;bottom:-34px;color:#f7921e;font-weight:600;font-size:14px}
.a{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1786051939/Arco_del_tiempo_520150f217.png)}
.b{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1781288854/sorprendente_fa1427a6a8.jpg)}
.c{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1781288923/imperdible_66c2ab3953.jpg)}
.copy{display:flex;align-items:flex-end;justify-content:space-between;padding:56px 70px 0}
.copy h1{font-size:104px;font-weight:800;letter-spacing:-.04em;line-height:.92}
.copy p{font-size:22px;color:#484848;margin-top:12px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:22px}
.ctas{display:flex;gap:12px}
.cta{display:flex;align-items:center;gap:14px;background:#1c231f;color:#fff;border-radius:999px;padding:8px 8px 8px 26px;font-weight:600;font-size:17px}
.cta i{width:46px;height:46px;border-radius:50%;background:#f7921e;display:block}
.wa{border:1.5px solid #1c231f;border-radius:999px;padding:19px 24px;font-weight:600;font-size:17px}
.ctrl{display:flex;gap:10px;align-items:center}
.ctrl span{width:50px;height:50px;border-radius:50%;border:1px solid #c9cdc2;display:block}
</style></head>
<body>
<header>
  <div class="logo">Senderos<br>CHIAPAS</div>
  <nav><span>Tours</span><span>Paquetes</span><span>Experiencias</span><span>Nosotros</span><span>Contáctanos</span></nav>
  <div class="hdr-btn">Contáctanos</div>
</header>
<div class="film">
  <div class="holes h1"></div><div class="holes h2"></div>
  <div class="frames">
    <div class="f c"><span class="n">03</span></div>
    <div class="f on a"><span class="n">01 — Arco del tiempo</span></div>
    <div class="f b"><span class="n">02</span></div>
  </div>
</div>
<section class="copy">
  <div><h1>Arco del tiempo</h1><p>Cintalapa, Chiapas.</p></div>
  <div class="right">
    <div class="ctas"><span class="cta">Más información<i></i></span><span class="wa">Cotizar por WhatsApp</span></div>
    <div class="ctrl"><span></span><span></span></div>
  </div>
</section>
</body></html>
