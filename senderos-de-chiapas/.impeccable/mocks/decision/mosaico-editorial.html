<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fdf9f1;font-family:Prompt,sans-serif;color:#1c231f}
header{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.logo{font-weight:800;font-size:26px;color:#d7262e;line-height:.9}
nav{display:flex;gap:30px;font-weight:500;font-size:17px;color:#63ab45}
.hdr-btn{background:#63ab45;color:#fff;border-radius:999px;padding:16px 28px;font-weight:600}
.hero{position:relative;height:760px;padding:16px 24px 24px}
.grid{position:absolute;right:24px;top:16px;bottom:24px;width:900px;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.tile{border-radius:22px;background:#999 center/cover;position:relative;overflow:hidden}
.big{grid-row:1/3;background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1786051939/Arco_del_tiempo_520150f217.png)}
.s1{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1781288854/sorprendente_fa1427a6a8.jpg)}
.s2{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1781288923/imperdible_66c2ab3953.jpg)}
.tile .lbl{position:absolute;left:16px;bottom:14px;right:16px;color:#fff;font-weight:600;font-size:18px;z-index:2}
.tile.small::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(12,18,14,.7),rgba(12,18,14,0) 55%)}
.tile .n{position:absolute;top:14px;left:16px;color:#fff;font-weight:600;font-size:14px;z-index:2;background:rgba(12,18,14,.35);padding:4px 10px;border-radius:999px}
.title{position:absolute;left:70px;top:150px;font-size:150px;font-weight:800;letter-spacing:-.045em;line-height:.88;z-index:3;width:900px}
.title span{display:block;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.35)}
.title b{display:block;color:#1c231f;font-weight:800}
.meta{position:absolute;left:70px;bottom:70px;z-index:3;width:440px}
.place{font-size:22px;color:#484848}
.ctas{display:flex;gap:12px;margin-top:26px}
.cta{display:flex;align-items:center;gap:14px;background:#1c231f;color:#fff;border-radius:999px;padding:8px 8px 8px 26px;font-weight:600;font-size:17px}
.cta i{width:46px;height:46px;border-radius:50%;background:#f7921e;display:block}
.wa{border:1.5px solid #1c231f;color:#1c231f;border-radius:999px;padding:19px 24px;font-weight:600;font-size:17px}
.ctrl{display:flex;gap:10px;margin-top:40px;align-items:center}
.ctrl span{width:50px;height:50px;border-radius:50%;border:1px solid #c9cdc2;display:block}
.ctrl b{font-weight:500;font-size:15px;margin-left:8px}
</style></head>
<body>
<header>
  <div class="logo">Senderos<br>CHIAPAS</div>
  <nav><span>Tours</span><span>Paquetes</span><span>Experiencias</span><span>Nosotros</span><span>Contáctanos</span></nav>
  <div class="hdr-btn">Contáctanos</div>
</header>
<section class="hero">
  <div class="grid">
    <div class="tile big"></div>
    <div class="tile small s1"><span class="n">02</span><span class="lbl">Chiapas Sorprendente</span></div>
    <div class="tile small s2"><span class="n">03</span><span class="lbl">Chiapas Imperdible</span></div>
  </div>
  <h1 class="title"><b>Arco del</b><span>tiempo</span></h1>
  <div class="meta">
    <p class="place">Cintalapa, Chiapas.</p>
    <div class="ctas"><span class="cta">Más información<i></i></span><span class="wa">Cotizar por WhatsApp</span></div>
    <div class="ctrl"><span></span><span></span><b>01 / 03</b></div>
  </div>
</section>
</body></html>
