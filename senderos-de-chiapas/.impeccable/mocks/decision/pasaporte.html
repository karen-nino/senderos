<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#fdf9f1;font-family:Prompt,sans-serif;color:#1c231f}
header{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.logo{font-weight:800;font-size:26px;color:#d7262e;line-height:.9}nav{display:flex;gap:30px;font-weight:500;font-size:17px;color:#63ab45}
.hdr-btn{background:#63ab45;color:#fff;border-radius:999px;padding:16px 28px;font-weight:600}
.field{margin:12px 24px 0;height:756px;border-radius:28px;background:#2a5a1d;display:grid;place-items:center;position:relative}
.book{display:grid;grid-template-columns:1fr 1fr;width:1120px;height:620px;transform:rotate(-2deg);box-shadow:0 40px 70px -30px rgba(0,0,0,.6)}
.pg{background:#f6f0e1;position:relative;padding:44px;background-image:repeating-radial-gradient(circle at 30% 40%,rgba(99,171,69,.08) 0 2px,transparent 2px 10px)}
.l{border-radius:14px 0 0 14px;box-shadow:inset -18px 0 30px -18px rgba(0,0,0,.25)}
.r{border-radius:0 14px 14px 0;box-shadow:inset 18px 0 30px -18px rgba(0,0,0,.25);display:flex;flex-direction:column;justify-content:center}
.photo{height:100%;background:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1786051939/Arco_del_tiempo_520150f217.png) center/cover;border:8px solid #fff;transform:rotate(1.5deg);box-shadow:0 10px 20px rgba(0,0,0,.2)}
.r h1{font-size:84px;font-weight:800;letter-spacing:-.04em;line-height:.92}
.r p{font-size:21px;color:#484848;margin-top:14px}
.ctas{display:flex;gap:12px;margin-top:34px}
.cta{display:flex;align-items:center;gap:14px;background:#1c231f;color:#fff;border-radius:999px;padding:8px 8px 8px 24px;font-weight:600;font-size:16px}
.cta i{width:42px;height:42px;border-radius:50%;background:#f7921e;display:block}
.wa{border:1.5px solid #1c231f;border-radius:999px;padding:17px 22px;font-weight:600;font-size:16px}
.seal{position:absolute;right:50px;top:40px;width:130px;height:130px;border:4px double #c76a06;border-radius:50%;display:grid;place-items:center;color:#c76a06;font-weight:800;font-size:40px;transform:rotate(-14deg);opacity:.85}
.nav{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;color:#fff;font-weight:500}
.nav span{width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.5);display:block}
</style></head><body>
<header><div class="logo">Senderos<br>CHIAPAS</div><nav><span>Tours</span><span>Paquetes</span><span>Experiencias</span><span>Nosotros</span><span>Contáctanos</span></nav><div class="hdr-btn">Contáctanos</div></header>
<div class="field"><div class="book"><div class="pg l"><div class="photo"></div></div>
<div class="pg r"><div class="seal">01</div><h1>Arco del tiempo</h1><p>Cintalapa, Chiapas.</p><div class="ctas"><span class="cta">Más información<i></i></span><span class="wa">Cotizar por WhatsApp</span></div></div></div>
<div class="nav"><span></span>01 / 03<span></span></div></div>
</body></html>
