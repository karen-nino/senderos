<!doctype html><html lang="es"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#fdf9f1;font-family:Prompt,sans-serif;color:#1c231f}
header{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 70px;background:#fdf9f1;position:relative;z-index:5}
.logo{font-weight:800;font-size:26px;color:#d7262e;line-height:.9}nav{display:flex;gap:30px;font-weight:500;font-size:17px;color:#63ab45}
.hdr-btn{background:#63ab45;color:#fff;border-radius:999px;padding:16px 28px;font-weight:600}
.cta{display:inline-flex;align-items:center;gap:14px;background:#fff;color:#1c231f;border-radius:999px;padding:8px 8px 8px 26px;font-weight:600;font-size:17px}
.cta i{width:46px;height:46px;border-radius:50%;background:#f7921e;display:block}
.wa{display:inline-block;border:1.5px solid #fff;color:#fff;border-radius:999px;padding:19px 24px;font-weight:600;font-size:17px}
.ctas{display:flex;gap:12px}
.hero{position:relative;height:790px;display:grid;grid-template-columns:40% 60%}
.panel{background:#2a5a1d;color:#fff;padding:0 60px 70px 70px;display:flex;flex-direction:column;justify-content:flex-end}
.panel h1{font-size:96px;font-weight:800;letter-spacing:-.04em;line-height:.9}
.panel p{font-size:22px;margin:14px 0 28px;opacity:.9}
.nav{display:flex;gap:10px;align-items:center;margin-top:48px;font-weight:500}.nav span{width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.5);display:block}
.slats{display:grid;grid-template-columns:repeat(6,1fr);perspective:1600px}
.slat{background:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1786051939/Arco_del_tiempo_520150f217.png) no-repeat;background-size:864px 790px}
.slat.t{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1781288854/sorprendente_fa1427a6a8.jpg);transform:rotateY(-40deg) scaleX(.85);filter:brightness(.8)}
.s1{background-position:0 0}.s2{background-position:-144px 0}.s3{background-position:-288px 0}.s4{background-position:-432px 0}.s5{background-position:-576px 0}.s6{background-position:-720px 0}
</style></head><body><header><div class="logo">Senderos<br>CHIAPAS</div><nav><span>Tours</span><span>Paquetes</span><span>Experiencias</span><span>Nosotros</span><span>Contáctanos</span></nav><div class="hdr-btn">Contáctanos</div></header>
<section class="hero"><div class="panel"><h1>Arco del tiempo</h1><p>Cintalapa, Chiapas.</p><div class="ctas"><span class="cta">Más información<i></i></span><span class="wa">Cotizar por WhatsApp</span></div><div class="nav"><span></span>01 / 03<span></span></div></div>
<div class="slats"><div class="slat s1"></div><div class="slat s2"></div><div class="slat s3"></div><div class="slat s4 t"></div><div class="slat s5 t"></div><div class="slat s6 t"></div></div></section></body></html>
