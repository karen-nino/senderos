<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fdf9f1;font-family:Prompt,sans-serif;color:#1c231f}
header{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.logo{font-weight:800;font-size:26px;color:#d7262e;line-height:.9}
nav{display:flex;gap:30px;font-weight:500;font-size:17px;color:#63ab45}
.hdr-btn{background:#63ab45;color:#fff;border-radius:999px;padding:16px 28px;font-weight:600}
.stage{position:relative;height:560px;perspective:1400px;margin-top:10px}
.card{position:absolute;top:20px;width:420px;height:520px;left:50%;border-radius:24px;background:#888 center/cover;box-shadow:0 40px 60px -30px rgba(0,0,0,.5)}
.center{transform:translateX(-50%);z-index:3}
.center::after{content:"";position:absolute;inset:0;border-radius:24px;background:linear-gradient(to top,rgba(12,18,14,.75),rgba(12,18,14,0) 55%)}
.center h1{position:absolute;left:30px;right:30px;bottom:30px;color:#fff;font-size:64px;font-weight:800;letter-spacing:-.035em;line-height:.95;z-index:2}
.l1{transform:translateX(-118%) rotateY(38deg) scale(.88);z-index:2;opacity:.9}
.r1{transform:translateX(18%) rotateY(-38deg) scale(.88);z-index:2;opacity:.9}
.l2{transform:translateX(-165%) rotateY(50deg) scale(.74);z-index:1;opacity:.5}
.r2{transform:translateX(65%) rotateY(-50deg) scale(.74);z-index:1;opacity:.5}
.a{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1786051939/Arco_del_tiempo_520150f217.png)}
.b{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1781288854/sorprendente_fa1427a6a8.jpg)}
.c{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1781288923/imperdible_66c2ab3953.jpg)}
.copy{text-align:center;margin-top:18px}
.copy p{font-size:20px;color:#484848}
.ctas{display:flex;gap:12px;justify-content:center;margin-top:18px}
.cta{display:flex;align-items:center;gap:14px;background:#1c231f;color:#fff;border-radius:999px;padding:8px 8px 8px 26px;font-weight:600;font-size:17px}
.cta i{width:46px;height:46px;border-radius:50%;background:#f7921e;display:block}
.wa{border:1.5px solid #1c231f;border-radius:999px;padding:19px 24px;font-weight:600;font-size:17px}
.side{position:absolute;top:290px;width:56px;height:56px;border-radius:50%;border:1px solid #c9cdc2;z-index:4}
.prev{left:70px}.next{right:70px}
</style></head>
<body>
<header>
  <div class="logo">Senderos<br>CHIAPAS</div>
  <nav><span>Tours</span><span>Paquetes</span><span>Experiencias</span><span>Nosotros</span><span>Contáctanos</span></nav>
  <div class="hdr-btn">Contáctanos</div>
</header>
<div class="stage">
  <span class="side prev"></span><span class="side next"></span>
  <div class="card l2 b"></div>
  <div class="card r2 b"></div>
  <div class="card l1 c"></div>
  <div class="card r1 b"></div>
  <div class="card center a"><h1>Arco del tiempo</h1></div>
</div>
<section class="copy">
  <p>Cintalapa, Chiapas.</p>
  <div class="ctas"><span class="cta">Más información<i></i></span><span class="wa">Cotizar por WhatsApp</span></div>
</section>
</body></html>
