<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fdf9f1;font-family:Prompt,sans-serif;color:#1c231f}
header{position:absolute;top:0;left:0;right:0;z-index:5;height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.logo{font-weight:800;font-size:26px;color:#fff;line-height:.9}
nav{display:flex;gap:30px;font-weight:500;font-size:17px;color:#fff}
.hdr-btn{background:#fff;color:#2f6b1c;border-radius:999px;padding:16px 28px;font-weight:600}
.field{position:absolute;inset:0;background:#4f9435}
.field::before{content:"";position:absolute;inset:0;background:radial-gradient(1200px 700px at 78% 60%,#63ab45 0,#4f9435 60%,#3f7f2a 100%)}
.copy{position:absolute;left:70px;top:230px;width:560px;z-index:3;color:#fff}
.copy h1{font-size:104px;font-weight:800;line-height:.92;letter-spacing:-.04em}
.copy .place{font-size:22px;margin-top:22px;opacity:.9}
.ctas{display:flex;gap:12px;margin-top:40px}
.cta{display:flex;align-items:center;gap:14px;background:#1c231f;color:#fff;border-radius:999px;padding:8px 8px 8px 26px;font-weight:600;font-size:17px}
.cta i{width:46px;height:46px;border-radius:50%;background:#f7921e;display:block}
.wa{background:#fff;color:#1c231f;border-radius:999px;padding:20px 26px;font-weight:600;font-size:17px}
.count{position:absolute;left:70px;bottom:60px;z-index:3;display:flex;align-items:center;gap:18px;color:#fff;font-weight:500}
.count span{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.5);display:block}
.count b{font-size:18px;font-variant-numeric:tabular-nums}
.stack{position:absolute;right:120px;top:150px;width:600px;height:680px;z-index:2}
.card{position:absolute;inset:0;background:#fff;padding:22px 22px 0;border-radius:6px;box-shadow:0 30px 60px -25px rgba(0,0,0,.5)}
.card .ph{height:520px;background:#ccc center/cover}
.card .foot{display:flex;justify-content:space-between;align-items:center;height:116px}
.card .foot p{font-size:26px;font-weight:600}
.card .foot small{display:block;font-size:15px;color:#6f756d;font-weight:400}
.stamp{width:78px;height:92px;border:3px dashed #f7921e;border-radius:4px;display:grid;place-items:center;color:#f7921e;font-weight:800;font-size:28px}
.c3{transform:rotate(7deg) translate(40px,10px)}
.c3 .ph{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1781288923/imperdible_66c2ab3953.jpg)}
.c2{transform:rotate(-5deg) translate(-30px,6px)}
.c2 .ph{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1781288854/sorprendente_fa1427a6a8.jpg)}
.c1{transform:rotate(1.5deg)}
.c1 .ph{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1786051939/Arco_del_tiempo_520150f217.png)}
</style></head>
<body>
<div class="field"></div>
<header>
  <div class="logo">Senderos<br>CHIAPAS</div>
  <nav><span>Tours</span><span>Paquetes</span><span>Experiencias</span><span>Nosotros</span><span>Contáctanos</span></nav>
  <div class="hdr-btn">Contáctanos</div>
</header>
<div class="copy">
  <h1>Arco del tiempo</h1>
  <p class="place">Cintalapa, Chiapas.</p>
  <div class="ctas">
    <span class="cta">Más información<i></i></span>
    <span class="wa">Cotizar por WhatsApp</span>
  </div>
</div>
<div class="count"><span></span><b>03 / 03</b><span></span></div>
<div class="stack">
  <div class="card c3"><div class="ph"></div><div class="foot"><p>Chiapas Imperdible</p><div class="stamp">01</div></div></div>
  <div class="card c2"><div class="ph"></div><div class="foot"><p>Chiapas Sorprendente</p><div class="stamp">02</div></div></div>
  <div class="card c1"><div class="ph"></div><div class="foot"><p>Arco del tiempo<small>Cintalapa, Chiapas.</small></p><div class="stamp">03</div></div></div>
</div>
</body></html>
