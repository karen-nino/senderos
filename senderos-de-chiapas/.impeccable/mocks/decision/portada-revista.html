<!doctype html><html lang="es"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#fdf9f1;font-family:Prompt,sans-serif;color:#1c231f}
header{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 70px;background:#fdf9f1}
.logo{font-weight:800;font-size:26px;color:#d7262e;line-height:.9}nav{display:flex;gap:30px;font-weight:500;font-size:17px;color:#63ab45}

.cta{display:inline-flex;align-items:center;gap:14px;background:#fff;color:#1c231f;border-radius:999px;padding:8px 8px 8px 26px;font-weight:600;font-size:17px}
.cta i{width:46px;height:46px;border-radius:50%;background:#f7921e;display:block}
.wa{display:inline-block;border:1.5px solid #fff;color:#fff;border-radius:999px;padding:19px 24px;font-weight:600;font-size:17px}
.ctas{display:flex;gap:12px}
.arrows{display:flex;gap:10px;align-items:center;color:#fff;font-weight:500}.arrows span{width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.5);display:block}
.hero{position:relative;height:790px;background:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1786051939/Arco_del_tiempo_520150f217.png) center 65%/cover;color:#fff}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,18,14,.55) 0%,rgba(12,18,14,0) 35%,rgba(12,18,14,0) 55%,rgba(12,18,14,.7) 100%),linear-gradient(270deg,rgba(12,18,14,.6),rgba(12,18,14,0) 40%)}
.mast{position:absolute;z-index:2;left:56px;right:56px;top:28px;font-size:190px;font-weight:800;letter-spacing:-.05em;line-height:.85;white-space:nowrap}
.rule{position:absolute;z-index:2;left:60px;right:60px;top:200px;height:2px;background:#fff;opacity:.6}
.lines{position:absolute;z-index:2;right:60px;top:300px;width:300px;display:flex;flex-direction:column;gap:30px}
.line b{display:block;color:#f7921e;font-size:15px;font-weight:600}.line p{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em;border-top:1px solid rgba(255,255,255,.5);padding-top:10px;margin-top:6px}
.foot{position:absolute;z-index:2;left:60px;bottom:56px}.foot p{font-size:24px;margin-bottom:24px}
.arrows{position:absolute;z-index:2;right:60px;bottom:60px}
</style></head><body><header><div class="logo">Senderos<br>CHIAPAS</div><nav><span>Tours</span><span>Paquetes</span><span>Experiencias</span><span>Nosotros</span><span>Contáctanos</span></nav><div class="hdr-btn">Contáctanos</div></header>
<section class="hero"><h1 class="mast">Arco del tiempo</h1><div class="rule"></div>
<div class="lines"><div class="line"><b>02</b><p>Chiapas Sorprendente</p></div><div class="line"><b>03</b><p>Chiapas Imperdible</p></div></div>
<div class="foot"><p>Cintalapa, Chiapas.</p><div class="ctas"><span class="cta">Más información<i></i></span><span class="wa">Cotizar por WhatsApp</span></div></div>
<div class="arrows"><span></span>01 / 03<span></span></div></section></body></html>
