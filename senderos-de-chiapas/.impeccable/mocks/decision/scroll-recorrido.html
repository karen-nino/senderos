<!doctype html><html lang="es"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#fdf9f1;font-family:Prompt,sans-serif;color:#1c231f}
header{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 70px;background:#fdf9f1;position:relative;z-index:5}
.logo{font-weight:800;font-size:26px;color:#d7262e;line-height:.9}nav{display:flex;gap:30px;font-weight:500;font-size:17px;color:#63ab45}
.hdr-btn{background:#63ab45;color:#fff;border-radius:999px;padding:16px 28px;font-weight:600}
.cta{display:inline-flex;align-items:center;gap:14px;background:#fff;color:#1c231f;border-radius:999px;padding:8px 8px 8px 26px;font-weight:600;font-size:17px}
.cta i{width:46px;height:46px;border-radius:50%;background:#f7921e;display:block}
.wa{display:inline-block;border:1.5px solid #fff;color:#fff;border-radius:999px;padding:19px 24px;font-weight:600;font-size:17px}
.ctas{display:flex;gap:12px}
.hero{position:relative;height:790px;background:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1786051939/Arco_del_tiempo_520150f217.png) center 60%/cover;color:#fff}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,18,14,.7),rgba(12,18,14,.1) 60%),linear-gradient(0deg,rgba(12,18,14,.6),rgba(12,18,14,0) 45%)}
.rail{position:absolute;z-index:2;left:70px;top:90px;bottom:90px;width:2px;background:rgba(255,255,255,.3)}
.rail i{position:absolute;left:0;top:0;width:2px;height:33%;background:#f7921e}
.stops{position:absolute;z-index:2;left:100px;top:80px;display:flex;flex-direction:column;gap:56px}
.stops p{font-size:18px;font-weight:500;opacity:.55}.stops p.on{opacity:1;font-size:22px;font-weight:600}
.stops b{display:block;font-size:13px;color:#f7921e}
.copy{position:absolute;z-index:2;left:100px;bottom:80px;width:760px}
.copy h1{font-size:120px;font-weight:800;letter-spacing:-.04em;line-height:.9}
.copy p{font-size:22px;margin:14px 0 28px;opacity:.9}
.hint{position:absolute;z-index:2;right:70px;bottom:80px;font-size:15px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:10px}
.hint span{width:30px;height:48px;border:2px solid #fff;border-radius:16px;position:relative}
.hint span::after{content:"";position:absolute;left:50%;top:10px;width:4px;height:8px;margin-left:-2px;background:#fff;border-radius:2px}
</style></head><body><header><div class="logo">Senderos<br>CHIAPAS</div><nav><span>Tours</span><span>Paquetes</span><span>Experiencias</span><span>Nosotros</span><span>Contáctanos</span></nav><div class="hdr-btn">Contáctanos</div></header>
<section class="hero"><div class="rail"><i></i></div>
<div class="stops"><p class="on"><b>01</b>Arco del tiempo</p><p><b>02</b>Chiapas Sorprendente</p><p><b>03</b>Chiapas Imperdible</p></div>
<div class="copy"><h1>Arco del tiempo</h1><p>Cintalapa, Chiapas.</p><div class="ctas"><span class="cta">Más información<i></i></span><span class="wa">Cotizar por WhatsApp</span></div></div>
<div class="hint"><span></span>Desliza para recorrer</div></section></body></html>
