<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#fdf9f1;font-family:Prompt,sans-serif;color:#1c231f}
header{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.logo{font-weight:800;font-size:26px;color:#d7262e;line-height:.9}nav{display:flex;gap:30px;font-weight:500;font-size:17px;color:#63ab45}
.hdr-btn{background:#63ab45;color:#fff;border-radius:999px;padding:16px 28px;font-weight:600}
.hero{position:relative;height:790px}
svg{position:absolute;inset:0}
.road{fill:none;stroke:#63ab45;stroke-width:26;stroke-linecap:round}
.dash{fill:none;stroke:#fdf9f1;stroke-width:3;stroke-dasharray:14 14}
.pin{position:absolute;width:56px;height:56px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#1c231f;display:grid;place-items:center}
.pin b{transform:rotate(45deg);color:#fff;font-size:16px}
.pin.on{background:#f7921e;width:70px;height:70px}
.p1{left:330px;top:560px}.p2{left:760px;top:330px}.p3{left:1240px;top:520px}
.card{position:absolute;left:840px;top:60px;width:440px;background:#fff;border-radius:22px;padding:12px;box-shadow:0 30px 50px -24px rgba(0,0,0,.4)}
.card .ph{height:300px;border-radius:14px;background:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1786051939/Arco_del_tiempo_520150f217.png) center/cover}
.card p{padding:14px 8px 6px;font-weight:600;font-size:20px}
.copy{position:absolute;left:70px;top:70px;width:620px}
.copy h1{font-size:110px;font-weight:800;letter-spacing:-.04em;line-height:.9}
.copy p{font-size:22px;color:#484848;margin-top:14px}
.ctas{display:flex;gap:12px;margin-top:28px}
.cta{display:flex;align-items:center;gap:14px;background:#1c231f;color:#fff;border-radius:999px;padding:8px 8px 8px 26px;font-weight:600;font-size:17px}
.cta i{width:46px;height:46px;border-radius:50%;background:#f7921e;display:block}
.wa{border:1.5px solid #1c231f;border-radius:999px;padding:19px 24px;font-weight:600;font-size:17px}
</style></head><body>
<header><div class="logo">Senderos<br>CHIAPAS</div><nav><span>Tours</span><span>Paquetes</span><span>Experiencias</span><span>Nosotros</span><span>Contáctanos</span></nav><div class="hdr-btn">Contáctanos</div></header>
<section class="hero">
<svg viewBox="0 0 1440 790"><path class="road" d="M -40 700 C 200 760, 300 560, 360 600 S 600 720, 700 520 S 820 300, 800 370 S 1000 640, 1260 560 S 1440 420, 1500 460"/><path class="dash" d="M -40 700 C 200 760, 300 560, 360 600 S 600 720, 700 520 S 820 300, 800 370 S 1000 640, 1260 560 S 1440 420, 1500 460"/></svg>
<div class="copy"><h1>Arco del tiempo</h1><p>Cintalapa, Chiapas.</p><div class="ctas"><span class="cta">Más información<i></i></span><span class="wa">Cotizar por WhatsApp</span></div></div>
<div class="pin p1"><b>03</b></div><div class="pin on p2"><b>01</b></div><div class="pin p3"><b>02</b></div>
<div class="card"><div class="ph"></div><p>Arco del tiempo</p></div>
</section></body></html>
