<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#fdf9f1;font-family:Prompt,sans-serif}
header{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.logo{font-weight:800;font-size:26px;color:#d7262e;line-height:.9}nav{display:flex;gap:30px;font-weight:500;font-size:17px;color:#63ab45}
.hdr-btn{background:#63ab45;color:#fff;border-radius:999px;padding:16px 28px;font-weight:600}
.stage{position:relative;margin:12px 24px 0;height:756px;border-radius:28px;overflow:hidden}
.side{position:absolute;inset:0;background:center/cover}
.a{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1786051939/Arco_del_tiempo_520150f217.png);clip-path:polygon(0 0,62% 0,48% 100%,0 100%)}
.b{background-image:url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1781288854/sorprendente_fa1427a6a8.jpg);clip-path:polygon(62% 0,100% 0,100% 100%,48% 100%)}
.a::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,18,14,.7),rgba(12,18,14,0) 55%)}
.b::after{content:"";position:absolute;inset:0;background:rgba(12,18,14,.35)}
.line{position:absolute;top:0;bottom:0;left:55%;width:4px;background:#fdf9f1;transform:skewX(-10.5deg)}
.handle{position:absolute;left:55%;top:50%;width:64px;height:64px;margin:-32px 0 0 -30px;border-radius:50%;background:#f7921e;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.copy{position:absolute;left:64px;bottom:64px;color:#fff;width:600px}
.copy h1{font-size:112px;font-weight:800;letter-spacing:-.04em;line-height:.9}
.copy p{font-size:22px;margin-top:14px;opacity:.9}
.ctas{display:flex;gap:12px;margin-top:30px}
.cta{display:flex;align-items:center;gap:14px;background:#fff;color:#1c231f;border-radius:999px;padding:8px 8px 8px 26px;font-weight:600;font-size:17px}
.cta i{width:46px;height:46px;border-radius:50%;background:#f7921e;display:block}
.wa{border:1.5px solid #fff;color:#fff;border-radius:999px;padding:19px 24px;font-weight:600;font-size:17px}
.next{position:absolute;right:60px;bottom:64px;text-align:right;color:#fff}
.next small{font-size:15px;opacity:.85}.next b{display:block;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
</style></head><body>
<header><div class="logo">Senderos<br>CHIAPAS</div><nav><span>Tours</span><span>Paquetes</span><span>Experiencias</span><span>Nosotros</span><span>Contáctanos</span></nav><div class="hdr-btn">Contáctanos</div></header>
<div class="stage"><div class="side a"></div><div class="side b"></div><div class="line"></div><div class="handle"></div>
<div class="copy"><h1>Arco del tiempo</h1><p>Cintalapa, Chiapas.</p><div class="ctas"><span class="cta">Más información<i></i></span><span class="wa">Cotizar por WhatsApp</span></div></div>
<div class="next"><small>Arrastra para ver</small><b>Chiapas<br>Sorprendente</b></div></div>
</body></html>
