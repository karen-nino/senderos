<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fdf9f1;font-family:Prompt,sans-serif;color:#1c231f}
header{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.logo{font-weight:800;font-size:26px;color:#d7262e;line-height:.9}
nav{display:flex;gap:30px;font-weight:500;font-size:17px;color:#63ab45}
.hdr-btn{background:#63ab45;color:#fff;border-radius:999px;padding:16px 28px;font-weight:600}
.hero{position:relative;padding:0 70px}
.title{font-size:178px;font-weight:800;letter-spacing:-.045em;line-height:.86;margin-top:6px;white-space:nowrap}
.title span{color:#63ab45}
.row{display:grid;grid-template-columns:1fr 300px;gap:40px;margin-top:26px}
.window{position:relative;height:470px;border-radius:28px;overflow:hidden;background:#2a3a2c url(https://res.cloudinary.com/dqsavdj0u/image/upload/v1786051939/Arco_del_tiempo_520150f217.png) center 60%/cover}
.window::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(12,18,14,.75),rgba(12,18,14,0) 55%)}
.dock{position:absolute;left:28px;right:28px;bottom:28px;z-index:2;display:flex;align-items:flex-end;justify-content:space-between}
.place{color:#fff;font-size:22px;font-weight:400}
.place b{display:block;font-size:15px;font-weight:500;opacity:.8}
.ctas{display:flex;gap:12px}
.cta{display:flex;align-items:center;gap:14px;background:#fff;color:#1c231f;border-radius:999px;padding:8px 8px 8px 26px;font-weight:600;font-size:17px}
.cta i{width:46px;height:46px;border-radius:50%;background:#63ab45;display:block}
.wa{background:#f7921e;color:#fff;border-radius:999px;padding:20px 26px;font-weight:600;font-size:17px}
.list{display:flex;flex-direction:column;justify-content:space-between;padding:6px 0}
.item{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:18px 0;border-top:1px solid #d9dccf}
.item:last-child{border-bottom:1px solid #d9dccf}
.n{font-size:15px;font-weight:600;color:#8b9085;font-variant-numeric:tabular-nums}
.t{font-size:22px;font-weight:600;line-height:1.15}
.s{font-size:14px;color:#6f756d;margin-top:4px}
.item.on .n{color:#63ab45}.item.on .t{color:#1c231f}
.item:not(.on) .t{color:#8b9085}
.bar{height:3px;background:#d9dccf;border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:45%;background:#63ab45}
.arrows{display:flex;gap:10px;margin-top:20px}
.arrows span{width:52px;height:52px;border-radius:50%;border:1px solid #c9cdc2;display:block}
</style></head>
<body>
<header>
  <div class="logo">Senderos<br>CHIAPAS</div>
  <nav><span>Tours</span><span>Paquetes</span><span>Experiencias</span><span>Nosotros</span><span>Contáctanos</span></nav>
  <div class="hdr-btn">Contáctanos</div>
</header>
<section class="hero">
  <h1 class="title">Arco del <span>tiempo</span></h1>
  <div class="row">
    <div class="window">
      <div class="dock">
        <p class="place">Cintalapa, Chiapas.</p>
        <div class="ctas">
          <span class="wa">Cotizar por WhatsApp</span>
          <span class="cta">Más información<i></i></span>
        </div>
      </div>
    </div>
    <div class="list">
      <div>
        <div class="item"><span class="n">01</span><div><p class="t">Chiapas Imperdible</p></div></div>
        <div class="item"><span class="n">02</span><div><p class="t">Chiapas Sorprendente</p></div></div>
        <div class="item on"><span class="n">03</span><div><p class="t">Arco del tiempo</p><p class="s">Cintalapa, Chiapas.</p><div class="bar"><i></i></div></div></div>
      </div>
      <div class="arrows"><span></span><span></span></div>
    </div>
  </div>
</section>
</body></html>
